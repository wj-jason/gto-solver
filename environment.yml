name: poker
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - numpy>=1.26
  - tqdm>=4.66
  - matplotlib>=3.8
  - pydantic>=2.5

  # dev / testing
  - pytest>=8.0
  - pytest-cov>=4.1
  - ruff>=0.4
  - mypy>=1.9
